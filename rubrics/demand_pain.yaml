dimension: demand_pain
version: 1
rubric_version: demand_pain@v1
scale: 0-5
description: Higher is better for the student (5 = strong, recurring, growing pain across independent sources).
anchors:
  5: "Five or more independent sources across 2+ platforms show the same recurring problem, with measurable growth in the last 6 months."
  4: "Four+ sources on 2+ platforms show clear recurring complaints or active workarounds."
  3: "Two or three sources show the problem, with moderate complaints and no clear growth."
  2: "Limited mentions (2 sources or single platform) with mild or niche complaints."
  1: "A single weak, isolated, or outdated mention."
  0: "No evidence of the problem in the knowledge base."
features:
  - n_sources
  - n_platforms
  - complaint_count
  - trend_growth
output_schema:
  - score
  - confidence
  - evidence_ids
  - reason
examples:
  - level: 5
    input: "6 HN threads and 4 GitHub issues complaining about slow Parquet exports over the past 4 months (trend_growth=0.45)."
    expected:
      score: 5.0
      confidence: 0.9
      evidence_ids: ["card_101#c0", "card_204#c1"]
      reason: "Strong recurring export pain across HN and GitHub with 45% recent growth."
  - level: 4
    input: "4 sources across HN and Product Hunt asking for automated invoice reconciliation."
    expected:
      score: 4.0
      confidence: 0.8
      evidence_ids: ["card_112#c1", "card_309#c0"]
      reason: "Consistent multi-platform demand with manual spreadsheet workarounds noted."
  - level: 3
    input: "3 HN comments mentioning clunky CI log filtering over the past year, flat trend."
    expected:
      score: 3.0
      confidence: 0.7
      evidence_ids: ["card_140#c2"]
      reason: "Moderate recurring complaint on a single trend plateau."
  - level: 2
    input: "2 older GitHub discussions wishing for a lighter Markdown slide tool."
    expected:
      score: 2.0
      confidence: 0.6
      evidence_ids: ["card_155#c0"]
      reason: "Mild interest across two related discussions without urgent pain."
  - level: 1
    input: "1 brief comment from 2023 asking if anyone built a terminal Pomodoro timer."
    expected:
      score: 1.0
      confidence: 0.5
      evidence_ids: ["card_170#c0"]
      reason: "Single old mention without corroborating evidence."
  - level: 0
    input: "No matching complaints or user requests found in retrieved cards."
    expected:
      score: 0.0
      confidence: 0.2
      evidence_ids: []
      reason: "No evidence of demand or pain found."
