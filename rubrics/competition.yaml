dimension: competition
version: 1
rubric_version: competition@v1
scale: 0-5
description: Higher is better for the student (5 = few or weak direct competitors, clear room to enter).
anchors:
  5: "No direct competitors serving this exact workflow; only generic manual tools or spreadsheets exist."
  4: "1-2 small or unmaintained competitors with clear gaps and low traction."
  3: "Several indirect or niche competitors exist, but none dominate the target segment."
  2: "Multiple active funded or popular open-source tools target the same user."
  1: "Crowded category with well-funded incumbents and high switching costs."
  0: "Saturated commodity market dominated by free built-in platform defaults."
features:
  - direct_competitor_count
  - funded_competitor_count
  - avg_competitor_recency_months
  - niche_saturation_label
output_schema:
  - score
  - confidence
  - evidence_ids
  - reason
examples:
  - level: 5
    input: "0 direct tools found in KB; users glue together bash scripts and Google Sheets."
    expected:
      score: 5.0
      confidence: 0.85
      evidence_ids: ["card_201#c0"]
      reason: "No direct product competitors; users rely on ad-hoc scripts."
  - level: 4
    input: "1 abandoned GitHub repo from 2023 with unresolved issues and no hosted offering."
    expected:
      score: 4.0
      confidence: 0.8
      evidence_ids: ["card_210#c1"]
      reason: "Only one stale open-source attempt exists."
  - level: 3
    input: "3 adjacent enterprise tools exist, none focused on solo creators or students."
    expected:
      score: 3.0
      confidence: 0.75
      evidence_ids: ["card_220#c0", "card_225#c2"]
      reason: "Moderate indirect competition leaves room in a narrower segment."
  - level: 2
    input: "5 active SaaS competitors launched on Product Hunt in the last year."
    expected:
      score: 2.0
      confidence: 0.8
      evidence_ids: ["card_230#c0", "card_231#c1"]
      reason: "Crowded niche with several recent launches."
  - level: 1
    input: "8+ YC-backed and Series B startups compete directly for the same buyer."
    expected:
      score: 1.0
      confidence: 0.9
      evidence_ids: ["card_240#c0", "card_241#c0"]
      reason: "Heavily funded incumbents dominate the space."
  - level: 0
    input: "Feature is already native and free inside VS Code and GitHub."
    expected:
      score: 0.0
      confidence: 0.9
      evidence_ids: ["card_250#c0"]
      reason: "Platform native default leaves no room for a standalone entrant."
