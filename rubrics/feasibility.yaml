dimension: feasibility
version: 1
rubric_version: feasibility@v1
scale: 0-5
description: Higher is better for the student (5 = fits hours, skills, and compute with generous margin).
anchors:
  5: "Fits well within <=60% of available hours, uses skills the student already has, and runs on their compute tier."
  4: "Fits within 60-85% of available hours with at most one minor new library to learn."
  3: "Tight fit (85-100% of available hours) or requires learning a major new framework."
  2: "Slightly over available hours or needs hardware/compute above student's tier unless scoped down."
  1: "Significantly exceeds hours (>1.5x budget) or requires specialized datasets/infra unavailable to student."
  0: "Impossible within student constraints (massive scale, custom hardware, or >2x hours)."
features:
  - estimated_build_hours
  - available_hours
  - hours_ratio
  - skill_match_ratio
  - compute_compatible
output_schema:
  - score
  - confidence
  - evidence_ids
  - reason
examples:
  - level: 5
    input: "80h estimated vs 240h available; Python+React stack matches profile; runs on laptop."
    expected:
      score: 5.0
      confidence: 0.9
      evidence_ids: ["card_401#c0"]
      reason: "Uses 33% of available hours with full stack and compute match."
  - level: 4
    input: "140h estimated vs 200h available; needs FastAPI (known) and Qdrant (new)."
    expected:
      score: 4.0
      confidence: 0.85
      evidence_ids: ["card_410#c0"]
      reason: "Comfortable margin with one new storage component."
  - level: 3
    input: "115h estimated vs 120h available; requires learning Rust."
    expected:
      score: 3.0
      confidence: 0.75
      evidence_ids: ["card_420#c0"]
      reason: "Barely fits time budget with steep language ramp-up."
  - level: 2
    input: "150h estimated vs 120h available; needs GPU inference for large vision models."
    expected:
      score: 2.0
      confidence: 0.8
      evidence_ids: ["card_430#c0"]
      reason: "Exceeds laptop compute and time budget without scope reduction."
  - level: 1
    input: "300h estimated vs 120h available; multi-region distributed streaming."
    expected:
      score: 1.0
      confidence: 0.85
      evidence_ids: ["card_440#c0"]
      reason: "Far exceeds solo/small-team time capacity."
  - level: 0
    input: "600h+ effort requiring custom FPGA hardware and proprietary clinical data."
    expected:
      score: 0.0
      confidence: 0.95
      evidence_ids: ["card_450#c0"]
      reason: "Infeasible on student hours and hardware."
